# Generated by tools/gen_mkdocs.py — edit that script, not this file.
site_name: Moto Mods Developer Documentation
site_description: >-
  A restored archive of the Moto Mods developer documentation originally
  published at developer.motorola.com, rebuilt from Wayback Machine captures.
site_url: https://jksim.github.io/motomods-docs/
repo_url: https://github.com/jksim/motomods-docs
repo_name: motomods-docs
edit_uri: ""
copyright: >-
  Original documentation &copy; Motorola Mobility LLC. Archived for historical
  and educational reference; not affiliated with or endorsed by Motorola or Lenovo.

docs_dir: docs
site_dir: site

theme:
  name: material
  language: en
  icon:
    logo: material/cellphone-link
    repo: fontawesome/brands/github
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.instant
    - navigation.tracking
    - navigation.indexes
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.tooltips
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Follow system theme
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep orange
      accent: deep orange
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep orange
      accent: deep orange
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

extra_css:
  - assets/stylesheets/extra.css

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.smartsymbols

plugins:
  - search

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/jksim/motomods-docs
      name: This archive on GitHub

